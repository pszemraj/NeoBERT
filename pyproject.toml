[build-system]
requires = ["setuptools >= 61.0", "setuptools-scm[toml] >= 8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neobert"
dynamic = ["version"]
description = "A state-of-the-art update of BERT"
requires-python = ">= 3.10"
dependencies = [
    "accelerate",
    "datasets",
    "einops",
    "evaluate",
    "filelock",
    "liger-kernel>=0.6",
    "mteb>=2.18",
    "numpy",
    "pyyaml",
    "requests",
    "safetensors",
    "scikit-learn",
    "torch>=2.6.0",
    "tqdm",
    "transformers>=5.4.0",
    "wandb",
]
authors = [
    { name = "Lola Le Breton", email = "lola.lebreton@mila.quebec" },
    { name = "Quentin Fournier", email = "quentin.fournier@mila.quebec" },
]
maintainers = [
    { name = "Lola Le Breton", email = "lola.lebreton@mila.quebec" },
    { name = "Quentin Fournier", email = "quentin.fournier@mila.quebec" },
]
readme = "README.md"
license = { text = "MIT License" }
keywords = []

[project.optional-dependencies]
dev = ["ruff", "pytest", "pytest-cov", "pytest-clarity"]
flash = ["flash-attn>=2.5"]
legacy-checkpoints = ["deepspeed"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["neobert*"]

[tool.setuptools_scm]
write_to = "src/neobert/_version.py"
version_scheme = "no-guess-dev"
local_scheme = "dirty-tag"

[tool.pytest.ini_options]
# Keep default `pytest -q` runs focused on the curated test suite.
testpaths = ["tests"]
filterwarnings = [
    # Keep project warnings strict without failing on optional CUDA/third-party
    # runtime warnings such as PyTorch NVML initialization messages.
    'error::neobert.warnings.NeoBERTWarning',
    # Triton constructs ast.AnnAssign without Python 3.13's new ``simple`` field.
    # Keep this scoped to the upstream compiler module and exact deprecation.
    'ignore:AnnAssign\.__init__ missing 1 required positional argument.*:DeprecationWarning:triton\.compiler\.code_generator',
]
# Prevent accidental collection of scratch data/scripts and large artifacts.
norecursedirs = [
    "local-scratch",
    "tests/manual",
    "outputs",
    "logs",
    "dist",
    "tokenized_data",
    ".git",
    ".venv",
    "build",
]
